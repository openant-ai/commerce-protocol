[package]
name = "openant-commerce-verifier"
version = "0.1.0-draft.4"
edition = "2021"
rust-version = "1.81"
license = "Apache-2.0"
description = "Fail-closed OpenAnt Commerce Protocol proof verifier"
repository = "https://github.com/openant-ai/commerce-protocol"
homepage = "https://github.com/openant-ai/commerce-protocol"
readme = "README.md"
keywords = ["x402", "eip3009", "commerce", "verification"]
categories = ["cryptography", "authentication"]
include = ["src/**", "tests/**", "test-vectors/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
alloy-dyn-abi = { version = "0.8.26", features = ["eip712"] }
alloy-primitives = { version = "0.8.26", features = ["k256"] }
base64 = "0.22"
ed25519-dalek = "2.2.0"
hex = "0.4"
p256 = { version = "0.13.2", features = ["ecdsa", "jwk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3.55", features = ["parsing"] }

[dev-dependencies]
